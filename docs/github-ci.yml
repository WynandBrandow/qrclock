# To switch on: in GitHub, Add file → Create new file → .github/workflows/ci.yml, paste this file.
# (The token on Mathys's PC lacks the "workflow" scope, so Claude can't push workflow files.)
# Runs on every push and pull request: type-check, lint and the unit tests. (The database and
# live-site suites need secrets and run from Mathys's PC: npm run verify:all.)
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
