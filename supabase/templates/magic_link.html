<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;max-width:480px">
  <h2 style="margin:0 0 12px">Sign in to QR Clock</h2>
  <p style="color:#334155;line-height:1.5">Tap the button to sign in. It works on any device, once, for the next hour.</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="background:#0f766e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600;display:inline-block">Sign in to QR Clock</a>
  </p>
  <p style="color:#64748b;font-size:13px;line-height:1.5">If you didn't ask to sign in, ignore this email; nothing happens without the button.</p>
</div>
